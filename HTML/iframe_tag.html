<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe tag</title>
</head>
<body align="center">
    <h2>wikipedia Website use in my webpage</h2>
    <iframe src="https://www.wikipedia.org/" frameborder="0" height="500" width="500"></iframe>
    <br><br>
    <hr><hr>

    <h2>Doremon Cartoon Video in my website though youtube 😄</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/oCpJtyBWTes?si=8dfPUw_oPJ77xvsn" 
    title="YouTube video player" frameborder="0"
     allow="accelerometer; autoplay; clipboard-write; 
     encrypted-media; gyroscope; picture-in-picture; web-share" 
     referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>


</body>
</html>
